# Warren den — the single-room area. Carries kobold_warren, so kobolds
# spawn here as well as in the entrance, and kobold_warren_den, which no
# other room carries, so the chieftain's rule can only ever place him
# here. Both tags use the same `mob_area` category.

file_id: 932c7620-7f79-478a-8696-3e0fbefdbb6f
entities:
  - entity_id: cb9f87b0-8b9e-428e-88e7-5f6f56d51755
    typeclass: evennia.objects.objects.DefaultRoom
    name: The Chieftain's Den
    location: null
    description: |
      A high-vaulted chamber lit by a bonfire in a stone pit. A crude
      throne of bones and antlers sits at the back of the room — the
      seat of whatever passes for kobold authority down here.
    tags:
      - { key: kobold_warren, category: mob_area }
      - { key: kobold_warren_den, category: mob_area }

    exits:
      - entity_id: e0fdeb26-38eb-415b-ab91-8948d9f849a9
        typeclass: evennia.objects.objects.DefaultExit
        name: north
        aliases: [n, entrance]
        destination: fd85ef0f-b338-448e-8731-6bdafee380a0   # warren_entrance

# Exits in other files that lead here, so this file rebuilds on its own.
incoming_exits:
  - 19f427a4-de39-485a-99f3-9b4ca1a5b82e   # warren_entrance: south
